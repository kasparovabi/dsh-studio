name: DshStudio
options:
  bundleIdPrefix: com.kasparov
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
targets:
  DshStudio:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - iOS
      - path: Resources/AppIcon.icns
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: DSH Studio
        CFBundleIconFile: AppIcon
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kasparov.dshstudio
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
  DshStudioIOS:
    type: application
    platform: iOS
    sources:
      - Sources/Model
      - Sources/iOS
    info:
      path: Info-iOS.plist
      properties:
        CFBundleDisplayName: DSH Studio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # NSAllowsLocalNetworking makes iOS ignore NSAllowsArbitraryLoads, which
        # blocks plain http to a tailnet 100.x address with NSURLError -1022.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Reach the dsh server running on your Mac.
        NSPhotoLibraryUsageDescription: Attach a picture to a task.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kasparov.dshstudio.phone
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "7"
      configs:
        Debug:
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: DSH Studio Phone AppStore
          DEVELOPMENT_TEAM: REDACTED
