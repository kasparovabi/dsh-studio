name: DshStudio
options:
  bundleIdPrefix: com.kasparov
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
targets:
  DshStudio:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - iOS
      - path: Resources/AppIcon.icns
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: DSH Studio
        CFBundleIconFile: AppIcon
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kasparov.dshstudio
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
